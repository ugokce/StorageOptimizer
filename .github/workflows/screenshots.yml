name: Screenshots

# Runs both apps in screenshot mode on a generated demo folder and commits the images to
# docs/screenshots, where the READMEs show them. Run it from the Actions tab after UI changes.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: [".github/workflows/screenshots.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS screenshots
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build app
        run: ./scripts/build_app.sh

      # Sparse files on the runner only, so the Cache Cleaner shows typical sizes without using disk space.
      - name: Add sample caches
        run: |
          sample() { mkdir -p "$(dirname "$1")" && mkfile -n "$2" "$1"; }
          sample ~/Library/Developer/Xcode/DerivedData/PhotoJournal-bqzkvhtxdfeuwagnsijcm/Build/Intermediates.noindex/PhotoJournal.build/Objects.zip 3400m
          sample ~/Library/Developer/Xcode/DerivedData/PhotoJournal-bqzkvhtxdfeuwagnsijcm/Index.noindex/DataStore/records.db 1800m
          sample ~/Library/Developer/Xcode/DerivedData/WeatherWidget-ahxtnrqopwlzgsedbfkcyu/Build/Products/Debug-iphonesimulator/WeatherWidget.app.zip 2100m
          sample ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex/SwiftUI.swiftmodule.pcm 900m
          sample "$HOME/Library/Developer/Xcode/iOS DeviceSupport/iPhone16,1 18.3 (22D63)/Symbols/dyld_shared_cache_arm64e" 5400m
          sample ~/Library/Caches/CocoaPods/Pods/Release/Firebase/Firebase.zip 1200m
          sample ~/.npm/_cacache/content-v2/sha512/packages.tar 1600m
          sample ~/.gradle/caches/modules-2/files-2.1/dependencies.jar 2300m

      - name: Take screenshots
        run: |
          output="$PWD/screenshots"
          "build/Storage Optimizer.app/Contents/MacOS/StorageOptimizer" --screenshots "$output" &
          pid=$!
          for second in $(seq 1 300); do
            kill -0 "$pid" 2>/dev/null || break
            # The app can't always bring itself to the front when started from a shell.
            if [ "$second" -le 40 ]; then
              osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $pid) to true" >/dev/null 2>&1 || true
            fi
            sleep 1
          done
          status=0
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "::error::The screenshot run didn't finish within 5 minutes."
            status=1
          else
            wait "$pid" || status=$?
          fi
          cat "$output/screenshots.log" 2>/dev/null || echo "No screenshots.log was written."
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: error

  windows:
    name: Windows screenshots
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Use a 1920x1080 screen
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      # Sparse files on the runner only, so the Cache Cleaner shows typical sizes without using disk space.
      - name: Add sample caches
        run: |
          function Add-Sample([string] $Path, [long] $Megabytes) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            fsutil file createnew $Path 0 | Out-Null
            fsutil sparse setflag $Path | Out-Null
            fsutil file seteof $Path ($Megabytes * 1000000) | Out-Null
          }
          Add-Sample "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Cache\Cache_Data\data_3" 1100
          Add-Sample "$env:LOCALAPPDATA\Microsoft\Edge\User Data\Default\Cache\Cache_Data\data_3" 640
          Add-Sample "$env:LOCALAPPDATA\Unity\cache\packages\packages.unity.com\com.unity.render-pipelines.universal.tgz" 2100
          Add-Sample "$env:LOCALAPPDATA\npm-cache\_cacache\content-v2\sha512\packages.tar" 1300
          Add-Sample "$env:LOCALAPPDATA\NuGet\v3-cache\packages.nupkg" 800
          Add-Sample "$env:USERPROFILE\.gradle\caches\modules-2\files-2.1\dependencies.jar" 1900

      - name: Publish
        run: |
          dotnet publish src/StorageOptimizer.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish/win-x64

      - name: Take screenshots
        run: |
          $output = Join-Path $PWD 'screenshots'
          $process = Start-Process -FilePath 'publish/win-x64/StorageOptimizer.exe' -ArgumentList '--screenshots', "`"$output`"" -PassThru
          $null = $process.Handle  # keeps the exit code available after the process ends
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            Write-Error 'The screenshot run did not finish within 5 minutes.'
            exit 1
          }
          if (Test-Path "$output/screenshots.log") { Get-Content "$output/screenshots.log" } else { Write-Host 'No screenshots.log was written.' }
          exit $process.ExitCode

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: windows/screenshots/
          if-no-files-found: error

  commit:
    name: Commit screenshots
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: screenshots-macos
          path: incoming/macos

      - uses: actions/download-artifact@v8
        with:
          name: screenshots-windows
          path: incoming/windows

      - name: Install pngquant and Pillow
        run: sudo apt-get update -q && sudo apt-get install -y -q pngquant python3-pil

      # A page that looks the same as the page before it was captured before it had been drawn.
      - name: Check that every page was captured
        run: |
          python3 - <<'EOF'
          import sys
          from PIL import Image, ImageChops, ImageStat

          pages = ["overview", "large-files", "folders", "file-types", "cache-cleaner"]
          problems = []
          for platform in ["macos", "windows"]:
              for theme in ["light", "dark"]:
                  images = []
                  for page in pages:
                      path = f"incoming/{platform}/{page}-{theme}.png"
                      try:
                          images.append(Image.open(path).convert("L").resize((160, 100)))
                      except FileNotFoundError:
                          problems.append(f"{path} is missing")
                          images.append(None)
                  for page, previous, current in zip(pages[1:], images, images[1:]):
                      if previous is not None and current is not None:
                          difference = ImageStat.Stat(ImageChops.difference(previous, current)).mean[0]
                          if difference < 2:
                              problems.append(f"{platform}/{page}-{theme}.png looks the same as the page before it")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Compress and commit
        run: |
          for platform in macos windows; do
            rm -rf "docs/screenshots/$platform"
            mkdir -p "docs/screenshots/$platform"
            for file in incoming/$platform/*.png; do
              target="docs/screenshots/$platform/$(basename "$file")"
              pngquant --quality=70-98 --speed 1 --strip --output "$target" "$file" || cp "$file" "$target"
            done
          done
          ls -l docs/screenshots/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "The screenshots didn't change."
            exit 0
          fi
          git commit -m "Update product screenshots [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
