name: macOS

# Windows-only and documentation changes don't need a (10x billed) macOS run.
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["windows/**", "docs/**", "**/*.md", ".github/workflows/windows.yml", ".github/workflows/screenshots.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["windows/**", "docs/**", "**/*.md", ".github/workflows/windows.yml", ".github/workflows/screenshots.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
  # The Release workflow builds the app through this workflow.
  workflow_call:
    inputs:
      version:
        description: Version written into the app, such as 1.2.0. Empty for development builds.
        type: string
        default: ""

concurrency:
  # When called by another workflow, github.workflow is the caller's name, so "macos" keeps the group apart
  # from the Windows build that the same caller runs.
  group: ${{ github.workflow }}-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/build_app.sh --universal ${VERSION:+--version "$VERSION"}

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: StorageOptimizer
          path: build/StorageOptimizer.zip
          if-no-files-found: error
